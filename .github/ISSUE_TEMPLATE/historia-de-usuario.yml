name: Historia de usuario
description: Funcionalidad de punta a punta que cierra una HU (o parte de ella) dentro de una épica.
title: "HU-XX · "
labels: ["enhancement"]
body:
  - type: input
    id: epica
    attributes:
      label: Parte de la épica
      description: Número de la épica de la fase. Agrega luego este issue como sub-issue de la épica.
      placeholder: "#27"
    validations:
      required: true
  - type: textarea
    id: alcance
    attributes:
      label: Alcance
      description: Qué podrá hacer el usuario al cerrar el issue, y qué RF, RN o HU cubre.
      placeholder: |
        Implementar `GET /api/v1/...` para que el usuario ...
        Cubre la HU-XX, RF-XX y RN-XX.
    validations:
      required: true
  - type: textarea
    id: que-hacer
    attributes:
      label: Qué hacer
      description: Pasos técnicos concretos (migraciones, dominio, casos de uso, adaptadores, pantallas, tests, docs).
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Dependencias, decisiones abiertas, riesgos y lo que queda fuera.
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Comportamiento verificable, uno por casilla. Cada uno debe tener su test.
      value: |
        - [ ]
    validations:
      required: true
