spring:
  application:
    name: kardexa
  config:
    # En local se lee el mismo .env que docker-compose.yml (raíz del repo), si existe.
    # Las variables de entorno siempre tienen prioridad sobre el archivo.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # Valores por defecto para desarrollo local con docker-compose.yml.
    # En cualquier otro entorno se definen con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:kardexa}}
    username: ${DB_USER:kardexa}
    password: ${DB_PASSWORD:kardexa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona solo Flyway (RNF-09)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
