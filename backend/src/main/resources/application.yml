spring:
  application:
    name: kardexa
  datasource:
    # Valores por defecto para desarrollo local con docker-compose.yml.
    # En cualquier otro entorno se definen con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kardexa}
    username: ${DB_USER:kardexa}
    password: ${DB_PASSWORD:kardexa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona solo Flyway (RNF-09)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
